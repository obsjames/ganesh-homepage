<title>Ganesh — a personal assistant</title>
<style>
  body { background:#14151a; color:#e8e6e3; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  main { max-width:560px; padding:3rem 2rem; text-align:center; }
  h1 { font-size:2.4rem; margin:0 0 .5rem; letter-spacing:.02em; }

<body>
<main>
  <span class="glyph">🐘</span>
  <h1>Ganesh</h1>
  <p>A personal, self-hosted AI assistant.</p>

     single-user application and is not available to the public.</p>
  <footer><a href="/privacy">Privacy policy</a></footer>
